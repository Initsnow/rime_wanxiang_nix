name: Update Assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v11

      - name: Refresh metadata
        run: nix develop -c ./scripts/update-metadata.sh

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Commit metadata changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- nix/metadata.nix; then
            echo "No metadata changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/metadata.nix
          git commit -m "chore: refresh immutable wanxiang asset metadata"
          branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          git push origin "HEAD:${branch}"
