name: Update Assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v11

      - name: Refresh metadata
        run: ./scripts/update-metadata.sh

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Commit changes to main
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- nix/metadata.nix; then
            echo "No metadata changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/metadata.nix
          git commit -m "chore: refresh immutable wanxiang asset metadata"
          git push origin HEAD:main
